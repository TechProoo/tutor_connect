# Railway build & deploy config for the Tutor Connect backend.
#
# Railway has to be pointed at this folder: set the service's Root Directory to
# "backend" in the dashboard, under Settings → Source. The repository root is a
# monorepo of four apps and holds no package.json of its own, so a build from
# the root finds nothing to detect and fails within seconds. This file is only
# read once the root directory points here.

[build]
# The builder installs dependencies itself before running this, so this must not
# reinstall them: `npm ci` starts by deleting node_modules, which fails outright
# against the builder's own layer with EBUSY on node_modules/.cache.
#
# `npm install` is left in front of the build because it does not delete
# anything. It is a near no-op when the dependencies are already complete, and
# fills in the compiler and the Nest CLI when they are not — both are dev
# dependencies, which npm skips whenever NODE_ENV is production, and the app
# wants that set at runtime.
#
# The Prisma client is generated rather than committed, so it has to exist
# before Nest compiles against it.
buildCommand = "npm install --include=dev --no-audit --no-fund && npx prisma generate && npm run build"

[deploy]
startCommand = "npm run start:prod"
# The app binds to $PORT, which Railway sets.
healthcheckPath = "/"
# Rasterising a guide is slow and CPU-bound; a generous timeout keeps a health
# check from failing a boot that is merely busy.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
