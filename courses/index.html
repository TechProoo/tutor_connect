<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Tutor Connect Guides — Unlock your study guide</title>
    <meta
      name="description"
      content="Enter the one-time access code from your purchase to unlock your Tutor Connect study guide. Read instantly on your phone — no account needed."
    />
    <meta name="author" content="Tutor Connect" />
    <!-- An access-code wall is a poor search result, so stay out of the index.
         Crawling is still allowed (see robots.txt) so link previews work. -->
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1a3a5c" />
    <link rel="canonical" href="https://courses.tutorconnect.ng/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/tc-icon.png" />
    <link rel="apple-touch-icon" href="/tc-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="TC Guides" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph — how the link looks when a code is shared on WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tutor Connect Guides" />
    <meta property="og:url" content="https://courses.tutorconnect.ng/" />
    <meta property="og:title" content="Your study guide is one code away" />
    <meta
      property="og:description"
      content="Enter the access code from your purchase to unlock your Tutor Connect study guide. Reads beautifully on your phone."
    />
    <meta property="og:image" content="https://courses.tutorconnect.ng/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tutor Connect Guides — your study guide is one code away" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your study guide is one code away" />
    <meta
      name="twitter:description"
      content="Enter the access code from your purchase to unlock your Tutor Connect study guide."
    />
    <meta name="twitter:image" content="https://courses.tutorconnect.ng/og-image.png" />
    <meta name="twitter:image:alt" content="Tutor Connect Guides — your study guide is one code away" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
