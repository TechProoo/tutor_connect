# Render Blueprint — deploys the NestJS backend from the backend/ folder.
# In Render: New + → Blueprint → pick this repo. Then fill in the env vars
# marked `sync: false` when prompted.
services:
  - type: web
    name: tutorconnect-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      # --- Database (Supabase Postgres) ---
      # Transaction pooler (port 6543, pgbouncer=true)
      - key: DATABASE_URL
        sync: false
      # Session pooler (port 5432) — used by Prisma migrations
      - key: DIRECT_URL
        sync: false

      # --- Admin dashboard ---
      # Required by the admin dashboard (sent as the x-admin-key header).
      - key: ADMIN_KEY
        generateValue: true

      # --- Guide storage (Supabase Storage) ---
      # https://<project-ref>.supabase.co
      - key: SUPABASE_URL
        sync: false
      # Service role key — Settings → API. Never expose this to a browser.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: guides
      # How many guide pages may be encoding and uploading at once. Higher is
      # faster but holds more full-size page buffers in memory; drop to 1 if a
      # long upload ever exhausts a small instance.
      - key: GUIDE_RENDER_CONCURRENCY
        value: "3"

      # --- Browser access ---
      # The tutorconnect.ng sites are allowed by default. Set this to a
      # comma-separated list of extra origins (a Netlify deploy preview, say);
      # no trailing slashes, they never match the browser's Origin header.
      - key: CORS_ORIGINS
        sync: false

      # --- Access-code emails (Resend) ---
      # Without this, codes are logged instead of emailed.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Tutor Connect <noreply@tutorconnect.ng>
      - key: COURSES_URL
        value: https://courses.tutorconnect.ng
      - key: SUPPORT_EMAIL
        value: support@tutorconnect.ng
      # Optional — international format, digits only (e.g. 2348012345678)
      - key: SUPPORT_WHATSAPP
        sync: false

      - key: NODE_VERSION
        value: 20.19.0
