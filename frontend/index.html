<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Tutor Connect | Find trusted student tutors on your campus</title>
    <meta
      name="description"
      content="Tutor Connect matches you with trusted student tutors on your own campus — by subject, level, and budget. Take the 2-minute survey to help shape peer tutoring at your school."
    />
    <meta
      name="keywords"
      content="Tutor Connect, campus tutoring, student tutors, peer tutoring, Nigeria, Bells University, UNILAG, OAU, find a tutor, university tutoring"
    />
    <meta name="author" content="Tutor Connect" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a3a5c" />
    <link rel="canonical" href="https://tutorconnect.ng/" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/tc-icon.png" />
    <link rel="apple-touch-icon" href="/tc-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tutor Connect" />
    <meta property="og:url" content="https://tutorconnect.ng/" />
    <meta
      property="og:title"
      content="Tutor Connect | Find trusted student tutors on your campus"
    />
    <meta
      property="og:description"
      content="Get matched with trusted student tutors on your own campus — by subject, level, and budget. Take the 2-minute survey."
    />
    <meta property="og:image" content="https://tutorconnect.ng/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tutor Connect — find the right tutor on your campus" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Tutor Connect | Find trusted student tutors on your campus"
    />
    <meta
      name="twitter:description"
      content="Get matched with trusted student tutors on your own campus — by subject, level, and budget. Take the 2-minute survey."
    />
    <meta name="twitter:image" content="https://tutorconnect.ng/og-image.png" />
    <meta name="twitter:image:alt" content="Tutor Connect — find the right tutor on your campus" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tutor Connect",
        "url": "https://tutorconnect.ng/",
        "logo": "https://tutorconnect.ng/tc-icon.png",
        "description": "Peer tutoring platform matching students with trusted tutors on their own campus by subject, level, and budget.",
        "areaServed": "NG"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Tutor Connect",
        "url": "https://tutorconnect.ng/"
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
